name: CI

# 검증 전용 workflow다. publish, registry token, secret release scan은 실행하지 않는다.

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:
    inputs:
      run-legacy-self-test:
        description: "고정 Chromium 75를 실제로 내려받아 self-test를 실행한다"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  ubuntu-node22:
    name: ubuntu-node22 (next webpack baseline full gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.12"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: install
        run: npm clean-install

      - name: format non-legacy repository files
        run: >-
          npx prettier --check
          .github/workflows/ci.yml .prettierrc.json eslint.config.js
          README.md package.json tsconfig.base.json tsconfig.json turbo.json
          tests
          scripts
          packages/next-webpack-baseline
          packages/legacy-browser-smoke
          apps/next-pages-fixture

      - name: lint root, active workspaces, and release scripts
        run: |
          npx eslint tests scripts --no-error-on-unmatched-pattern
          npm run lint --workspace=@cp949/next-webpack-baseline
          npm run lint --workspace=next-pages-fixture
          npm run lint --workspace=@cp949/legacy-browser-smoke

      - name: typecheck root and active workspaces
        run: |
          npx tsc -p tsconfig.json --noEmit
          npm run typecheck --workspace=@cp949/next-webpack-baseline
          npm run typecheck --workspace=next-pages-fixture
          npm run typecheck --workspace=@cp949/legacy-browser-smoke

      - name: build active packages and Next.js 16 Webpack fixture
        run: |
          npm run build --workspace=@cp949/next-webpack-baseline
          npm run build --workspace=next-pages-fixture
          npm run build --workspace=@cp949/legacy-browser-smoke

      - name: root and active package tests
        run: |
          npx vitest run tests --no-file-parallelism
          npm test --workspace=@cp949/next-webpack-baseline
          npm test --workspace=@cp949/legacy-browser-smoke

      - name: release script tests
        run: npm run test:scripts

      - name: package files and packed consumer
        run: |
          npm run check-package-files
          npm run test-packed-package -- --package @cp949/next-webpack-baseline
          npm run test-packed-package -- --package @cp949/legacy-browser-smoke

      - name: public words generic scan
        run: npm run check-public-words

      - name: build tarball for Node 20 runtime verification
        working-directory: packages/next-webpack-baseline
        run: |
          mkdir -p "${{ runner.temp }}/next-webpack-baseline-tgz"
          npm pack --pack-destination "${{ runner.temp }}/next-webpack-baseline-tgz"

      - uses: actions/upload-artifact@v4
        with:
          name: next-webpack-baseline-tarball
          path: ${{ runner.temp }}/next-webpack-baseline-tgz/*.tgz
          if-no-files-found: error
          retention-days: 7

  ubuntu-node20-packed-runtime:
    name: ubuntu-node20 (packed root import and facade)
    needs: ubuntu-node22
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: actions/download-artifact@v4
        with:
          name: next-webpack-baseline-tarball
          path: ${{ runner.temp }}/next-webpack-baseline-tgz

      - name: install artifact and exercise public root
        shell: bash
        run: |
          set -euo pipefail
          consumer="${{ runner.temp }}/next-webpack-baseline-consumer"
          mkdir -p "$consumer"
          cd "$consumer"
          npm init -y
          npm pkg set 'browserslist.production[0]=chrome 75'
          npm install "${{ runner.temp }}"/next-webpack-baseline-tgz/*.tgz
          node --input-type=module -e '
            import { createNextWebpackBaseline, defineConfig } from "@cp949/next-webpack-baseline";
            const facade = createNextWebpackBaseline(defineConfig({ projectDir: process.cwd(), policy: [] }));
            if (!Array.isArray(facade.transpilePackages) || typeof facade.webpackPlugin !== "function") process.exit(1);
          '

  windows-node22:
    name: windows-node22 (path focused tests)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.12"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: install
        run: npm clean-install

      - name: downlevel and Webpack plugin tests
        run: npx vitest run packages/next-webpack-baseline/test/downlevel.test.ts packages/next-webpack-baseline/test/webpack-plugin.test.ts

  legacy-self-test:
    name: legacy-self-test (manual Chromium 75 self-test)
    if: github.event_name == 'workflow_dispatch' && inputs.run-legacy-self-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.12"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: install
        run: npm clean-install

      - name: build legacy-browser-smoke
        run: npm run build --workspace=@cp949/legacy-browser-smoke

      - name: cache managed Chromium 75
        uses: actions/cache@v4
        with:
          path: ~/.cache/@cp949/legacy-browser-smoke
          key: legacy-chromium-linux-x64-650583-10ae4e05d9f01a8b646dd2ccc2ac1135e597c472abe5be71552aae7d8a35e2ac

      # npm exec는 `--` 뒤를 그대로 <cmd> [args...]로 실행한다. 두 번째 `--`를
      # 더 넣으면 CLI 자신의 argv 파서가 그 `--`를 "알 수 없는 인자"로 보고
      # fail-closed로 거부한다(로컬 --help로 실측). --no-sandbox 뒤 이유는
      # 격리된 GitHub Actions runner container 전용이라는 뜻이다.
      - name: run legacy-browser-smoke self-test
        run: npm exec --workspace=@cp949/legacy-browser-smoke -- legacy-browser-smoke-self-test --no-sandbox "isolated GitHub Actions container"
