name: CI

# 이 workflow는 검증만 한다. publish나 npm registry token 사용은 어디에도
# 없다 — 실제 배포(npm publish, git tag)는 사람이 로컬에서 수행한다.
#
# 이 workflow는 이 세션에서 실행/검증하지 못했다(GitHub Actions runner가
# 없는 환경에서 작성됨). YAML 문법과 각 job의 명령 자체는 로컬에서 실제로
# 통과함을 확인했지만, 실제 GitHub Actions 위에서 도는지는 별도로
# 확인해야 한다.

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Ubuntu + Node 22: 전체 gate. format/lint/typecheck/test부터 build,
  # demo 재현, pack 검증, 공개 정보 "제네릭" gate까지 한 번에 돈다.
  ubuntu-node22:
    name: ubuntu-node22 (full gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.12"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: install
        run: npm clean-install

      - name: format:check
        run: npm run format:check

      - name: lint
        run: npm run lint

      - name: typecheck
        run: npm run typecheck

      - name: unit/integration test (vitest)
        run: npm test

      - name: 공개 정보 scanner 자체의 unit/integration test
        # scripts/check-public-words.test.mjs는 vitest가 아니라 Node 내장
        # test runner로 돈다(root "test" script가 --exclude "scripts/**"로
        # 이 파일을 제외한다) — 여기서 별도로 돌려 CI에서 계속 검증되게 한다.
        run: node --test scripts/check-public-words.test.mjs

      - name: build
        run: npm run build

      - name: demo build (fixture 생성)
        run: npm run build --workspace=apps/demo

      - name: demo 재현 — compatible fixture (exit 0이어야 함)
        run: npm exec --workspace=apps/demo -- bb-check library check --config ./bb-check.config.mjs --dir ./fixtures/compatible

      - name: demo 재현 — incompatible fixture (exit 1이어야 함)
        # bb-check library check는 위반이 있으면 exit 1로 끝난다 — 이 step
        # 에서는 그 exit 1이 "성공"이므로 `!`로 뒤집는다. exit 0으로
        # 끝나버리면(위반을 못 찾으면) 이 step 자체가 실패해야 한다.
        run: |
          if npm exec --workspace=apps/demo -- bb-check library check --config ./bb-check.config.mjs --dir ./fixtures/incompatible; then
            echo "::error::incompatible fixture 검사가 exit 0으로 끝났다(exit 1을 기대함)."
            exit 1
          fi

      - name: pack — package 파일 allowlist 검증
        run: node scripts/check-package-files.mjs

      - name: pack — 격리 설치·실행 검증
        run: node scripts/test-packed-package.mjs

      - name: 공개 정보 scanner — 제네릭 gate
        # BB_CHECK_FORBIDDEN_WORDS는 CI에 두지 않는다(실제 forbidden word는
        # 운영 비밀이며 이 저장소 어디에도 하드코딩하지 않는다). 여기서는
        # --release 없이 실행해 git ls-files/npm pack 수집과 binary 판별·
        # 매칭 메커니즘 자체가 깨지지 않았는지만 확인한다. 실제 배포 전
        # --release gate는 사람이 로컬에서 BB_CHECK_FORBIDDEN_WORDS를 채워
        # 수동으로 돌린다(이 workflow에는 없다).
        run: node scripts/check-public-words.mjs

      - name: Node 20 job이 쓸 tarball 만들기
        working-directory: packages/bb-check
        run: npm pack --pack-destination "${{ runner.temp }}/bb-check-tgz"

      - uses: actions/upload-artifact@v4
        with:
          name: bb-check-tarball
          path: ${{ runner.temp }}/bb-check-tgz/*.tgz
          if-no-files-found: error
          retention-days: 7

  # Ubuntu + Node 20: ubuntu-node22가 만든 tarball을 내려받아, 그 안의
  # dist/**를 그대로 복원한 뒤 packed-package runtime test만 돈다(install/
  # lint/build 등은 하지 않는다). @cp949/bb-check의 package.json#engines는
  # ">=22.12"를 요구하므로, 이 job은 "그 요구를 벗어난 Node에서 실제로
  # 설치·실행하면 무슨 일이 일어나는가"를 있는 그대로 관찰하는 job이다.
  ubuntu-node20-packed-runtime:
    name: ubuntu-node20 (packed-package runtime only)
    needs: ubuntu-node22
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: actions/download-artifact@v4
        with:
          name: bb-check-tarball
          path: ${{ runner.temp }}/bb-check-tgz

      - name: Node 22 tarball의 dist/**를 packages/bb-check/dist에 복원
        shell: bash
        run: |
          set -euo pipefail
          tgz="$(ls "${{ runner.temp }}"/bb-check-tgz/*.tgz)"
          extract_dir="${{ runner.temp }}/bb-check-tarball-extracted"
          mkdir -p "$extract_dir"
          tar -xzf "$tgz" -C "$extract_dir"
          rm -rf packages/bb-check/dist
          cp -R "$extract_dir/package/dist" packages/bb-check/dist

      - name: packed-package runtime test
        # 이 스크립트는 그 자체로 node: 내장 모듈만 쓰므로 root npm install
        # 없이도 실행된다. 내부에서 다시 `npm pack`(위에서 복원한 dist/**
        # 기준)과 격리된 임시 프로젝트에 대한 `npm install <tgz>`를 수행해
        # Node 20 런타임에서 실제로 설치·실행되는지를 검증한다.
        run: node scripts/test-packed-package.mjs

  # Windows + Node 22: 전체 gate를 다시 돌리지 않는다. install과, path/
  # dependency-closure에 민감한 테스트, 실제 CLI process 테스트만 초점을
  # 맞춰 돈다.
  windows-node22:
    name: windows-node22 (focused subset)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.12"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: install
        run: npm clean-install

      - name: build (bb-check만 — demo/bb-nextjs는 이 job의 범위 밖)
        # @cp949/bb-core, @cp949/bb-library는 package.json#exports가
        # ./src/index.ts를 직접 가리켜(private workspace package라 build
        # 산출물이 필요 없다) bb-check의 vite build가 그 source를 바로
        # inline 번들한다 — 별도로 먼저 build할 필요가 없다.
        run: npm run build --workspace=packages/bb-check

      - name: dependency-closure/경로 focused test
        # dependency-closure.test.ts는 win32/POSIX 경로 판정을 호스트 OS의
        # path 모듈에 기대지 않고 명시적으로 검사하도록 설계됐다(소스 주석
        # 참고) — Windows에서 실제로 도는 게 중요한 파일이다. dist-entries/
        # config-loader도 경로 해석이 핵심이라 함께 포함한다.
        run: npx vitest run packages/bb-library/test/dependency-closure.test.ts packages/bb-library/test/dist-entries.test.ts packages/bb-check/test/config-loader.test.ts

      - name: CLI process test (함수 호출 기반)
        run: npx vitest run packages/bb-check/test/cli.test.ts

      - name: CLI process test (실제 subprocess — pack/install/실행)
        run: node scripts/test-packed-package.mjs
